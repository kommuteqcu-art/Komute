<style>
  html, body { height: 100%; margin: 0; background: #004d40; }
  #kSplash, .k-splash { position: fixed; inset: 0; z-index: 99999; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    color: #fff; font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 80% at 50% 38%, #007a66 0%, #005a4b 45%, #00372d 100%); transition: opacity .45s ease; }
  .k-splash.k-out { opacity: 0; pointer-events: none; }
  .k-splash .k-map { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .5; pointer-events: none; }
  .k-splash .k-map path { fill: none; stroke: rgba(255,255,255,.10); stroke-width: 1.4; stroke-linecap: round; }
  .k-splash .k-map path.k-main { stroke: rgba(255,200,74,.28); stroke-width: 2.2; stroke-dasharray: 6 9; animation: kFlow 2.4s linear infinite; }
  .k-splash .k-center { position: relative; display: flex; flex-direction: column; align-items: center; padding: 24px; }
  .k-splash .k-tile { position: relative; width: 104px; height: 104px; border-radius: 26px; display: grid; place-items: center;
    background: linear-gradient(145deg, #0a8f78, #004d40); border: 2px solid rgba(255,200,74,.85); box-shadow: 0 14px 40px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.12); animation: kRise .7s cubic-bezier(.2,.9,.3,1.2) both; }
  .k-splash .k-tile img { width: 78px; height: 78px; border-radius: 18px; }
  .k-splash .k-tile::before, .k-splash .k-tile::after { content: ""; position: absolute; inset: -2px; border-radius: 28px; border: 2px solid rgba(255,200,74,.55); animation: kRing 2.2s ease-out infinite; }
  .k-splash .k-tile::after { animation-delay: 1.1s; }
  .k-splash .k-name { margin-top: 22px; font-family: "Bricolage Grotesque", "Figtree", system-ui, sans-serif; font-size: 2.5rem; font-weight: 800; letter-spacing: .5px; line-height: 1; animation: kFade .7s .15s ease both; }
  .k-splash .k-name b { color: #ffc84a; font-weight: 800; }
  .k-splash .k-sub { margin-top: 8px; font-size: 1rem; opacity: .88; animation: kFade .7s .3s ease both; }
  .k-splash .k-route { position: relative; width: 190px; height: 28px; margin-top: 30px; animation: kFade .7s .45s ease both; }
  .k-splash .k-route::before { content: ""; position: absolute; left: 12px; right: 12px; top: 13px; border-top: 3px dotted rgba(255,255,255,.4); }
  .k-splash .k-route i { position: absolute; top: 5px; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-sizing: border-box; }
  .k-splash .k-route i.a { left: 0; background: #1a73e8; }
  .k-splash .k-route i.b { right: 0; background: #d93025; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
  .k-splash .k-route u { position: absolute; top: 8px; left: 12px; width: 12px; height: 12px; border-radius: 50%; background: #ffc84a; box-shadow: 0 0 12px 3px rgba(255,200,74,.7); animation: kGo 1.7s ease-in-out infinite; }
  .k-splash .k-msg { margin-top: 16px; min-height: 2.8em; max-width: 300px; font-size: .95rem; opacity: .9; }
  .k-splash .k-foot { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); font-size: .78rem; letter-spacing: .6px; text-transform: uppercase; opacity: .55; }
  .k-splash a.k-btn { display: none; margin-top: 8px; padding: 11px 22px; border-radius: 12px; background: #ffc84a; color: #3a2a00; font-weight: 700; text-decoration: none; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  @keyframes kRise { 0% { transform: translateY(14px) scale(.85); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes kFade { 0% { transform: translateY(8px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes kRing { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.45); opacity: 0; } }
  @keyframes kGo { 0% { left: 12px; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { left: calc(100% - 24px); opacity: 0; } }
  @keyframes kFlow { to { stroke-dashoffset: -30; } }
  @media (prefers-reduced-motion: reduce) { .k-splash *, .k-splash *::before, .k-splash *::after { animation: none !important; } .k-splash .k-route u { left: 50%; } }
</style>

    <div class="k-msg" id="msg">Opening Komute…</div>
    <a class="k-btn" id="open" href="https://komute.onrender.com">Open Komute</a>
  </div>
  <div class="k-foot">Made for QC commuters</div>
</div>
<script>
/* Komute opening page. It lives on a site that is always awake (GitHub Pages), so people see this
   instead of Render's "waking up" screen. It checks the Komute server and opens it as soon as it answers. */
var APP = "https://komute.onrender.com";                       // your Komute address on Render
var started = Date.now(), done = false;
function go() {
  if (done) return; done = true;
  location.replace(APP + (location.search || "") + (location.hash || ""));
}
function say(t) { document.getElementById("msg").textContent = t; }
function check() {
  if (done) return;
  var waited = Date.now() - started;
  if (waited > 7000) say("Waking up the Komute server. This can take up to a minute the first time. Please wait…");
  if (waited > 20000) say("Still starting. Almost there…");
  if (waited > 75000) { say("This is taking longer than usual."); var b = document.getElementById("open"); b.style.display = "inline-block"; }
  var ctl = typeof AbortController === "function" ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 9000);
  fetch(APP + "/health?t=" + Date.now(), { cache: "no-store", signal: ctl ? ctl.signal : undefined })
    .then(function (r) { return r.json(); })
    .then(function (j) { clearTimeout(timer); if (j && j.ok) { say("Ready!"); setTimeout(go, 200); } else setTimeout(check, 2500); })
    .catch(function () { clearTimeout(timer); setTimeout(check, 2500); });
}
check();
</script>
