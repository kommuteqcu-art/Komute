# Render blueprint: render.com -> New -> Blueprint -> pick this GitHub repo.
services:
  - type: web
    name: komute
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.mjs
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NOMINATIM_USER_AGENT
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_MAPS_GROUNDING
        value: "false"
      - key: AI_PROVIDER
        value: auto
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
